<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasia Agropecuária</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌾 Reino Místico da Agropecuária 🌱</h1>
        <p>Descubra os segredos encantados da agricultura e pecuária!</p>
    </header>

    <main>
        <section class="imagens">
            <h2>Visões Encantadas</h2>
            <div class="image-container">
                <img src="https://picsum.photos/id/1015/600/400" alt="Fazenda Fantástica" class="fantasy-img">
                <figcaption>Reino das Colheitas Mágicas</figcaption>
            </div>
            <div class="image-container">
                <img src="https://picsum.photos/id/107/600/400" alt="Animais Místicos" class="fantasy-img">
                <figcaption>Rebanho dos Espíritos da Terra</figcaption>
            </div>
        </section>

        <section class="flashcards">
            <h2>Cartas de Conhecimento Encantado</h2>
            <div class="deck" id="flashcard-deck"></div>
            <button id="next-btn" class="magic-btn">Próxima Carta ✨</button>
        </section>
    </main>

    <footer>
        <p>Feito com magia para amantes da agropecuária</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
